[[patch]]
    name = "Disable Motion Blur & Radial Blur"
    desc = "Skips RenderMotionBlur (eliminating an unconditional full-screen 1280x720 EDRAM resolve every frame) and disables radial blur in the post-process composite shader."
    author = "PS5X360"
    is_enabled = false

    [[patch.be32]]
        address = 0x82c84a40
        value = 0x4e800020
    [[patch.be32]]
        address = 0x82c5e4b0
        value = 0x38600000
    [[patch.be32]]
        address = 0x82c5e4b4
        value = 0x4e800020
    [[patch.be32]]
        address = 0x82c838d4
        value = 0x7e2b8b78

[[patch]]
    name = "Disable Depth of Field (DOF)"
    desc = "Skips the 4-pass Depth of Field post-processing filter and selects the non-DOF composite shader permutation."
    author = "PS5X360"
    is_enabled = false

    [[patch.be32]]
        address = 0x82c8541c
        value = 0x3b800000
    [[patch.be32]]
        address = 0x82c8389c
        value = 0x7e2a8b78

[[patch]]
    name = "Disable Bloom & Glare"
    desc = "Disables multi-pass downscale/Gaussian Bloom and Glare in CPostProcessManager::UpdateFromCamera."
    author = "PS5X360"
    is_enabled = false

    [[patch.be32]]
        address = 0x82c8575c
        value = 0x39200000
    [[patch.be32]]
        address = 0x82c85764
        value = 0x39000000
